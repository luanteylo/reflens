[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflens"
version = "0.1.0"
description = "AI-powered scientific paper database with semantic search and citation management"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    # PDF extraction
    "PyMuPDF>=1.24.0",
    "httpx>=0.27.0",
    "lxml>=5.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Config and CLI
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",

    # AI providers
    "anthropic>=0.40.0",
    "openai>=1.50.0",

    # Vector store and embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # MCP
    "mcp>=1.0.0",

    # Auth
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "fastapi-mail>=1.4.0",
    "slowapi>=0.1.9",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
reflens = "reflens.cli:main"
reflens-mcp = "reflens.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["reflens"]

[tool.coverage.report]
fail_under = 70
